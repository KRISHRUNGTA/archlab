<title>ArchLab</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
/* Layout: sticky tab strip over one working panel per topic; worked steps sit beside every calculator.
   Tokens: graph-paper ink on cool paper; one blue accent; hit/miss/fault get their own semantic colours. */
/* Direction: an instrument bench. Cool drafting paper (or night-lab dark) with a faint graph grid behind the hero,
   one signal blue, and the pipeline's own stage colours as the only decoration. Display: Archivo (width axis), body: IBM Plex Sans, data: IBM Plex Mono. */
/* Direction (v12): near-black navy hardware-debug workstation. Page #070B14, header #090E19, panels #101827, secondary #131D2D, inputs #080D17,
   hover #1B2940, selected #17263B, rules #202D40, accents #7098CC / #426B9A, text #E8EEF7 / #A0AEC2 / #7F91AA. Semantic green / amber / red kept for results.
   Dark is the default; the toggle switches to the light palette (navy header, steel-blue actions). Motion: 150-300 ms opacity/colour/transform only. */
:root {
  --slate: #a0aec2;
  --bg: #070b14;
  --surface: #101827;
  --surface-2: #131d2d;
  --surface-3: #1b2940;
  --ink: #e8eef7;
  --ink-2: #a0aec2;
  --ink-3: #7f91aa;
  --rule: #202d40;
  --rule-2: #2b3b54;
  --accent: #7098cc;
  --accent-2: #426b9a;
  --accent-ink: #0b1120;
  --accent-soft: #17263b;
  --nav: #090e19;
  --focus: rgba(125, 167, 217, .28);
  --press: #3a6189;
  --good: #6cc9a0; --good-soft: #12332f;
  --bad: #f0907f; --bad-soft: #33202b;
  --warn: #e0b25a; --warn-soft: #2e2c22;
  --grid: rgba(255, 255, 255, .025);
  --shadow: none;
  --hero-a: #101827; --hero-b: #101827;
  --font-body: "Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
  --font-display: "Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --input: #080d17; --work: #0b1120; --sel: #17263b; --hover: #1b2940;
  color-scheme: dark;
}
:root[data-theme="light"] {
  --slate: #253b53;
  --bg: #f7f9fc;
  --surface: #ffffff;
  --surface-2: #e8eef4;
  --surface-3: #dbe4ed;
  --ink: #172b4d;
  --ink-2: #54657c;
  --rule: #dde4ec;
  --rule-2: #c5d0dc;
  --accent: #477998;
  --accent-ink: #ffffff;
  --accent-soft: #e3edf4;
  --nav: #172b4d;
  --good: #2e7d55;
  --good-soft: #e3f1e8;
  --bad: #b3392e;
  --bad-soft: #fbe7e4;
  --warn: #946200;
  --warn-soft: #f8edcf;
  --grid: rgba(23, 43, 77, .05);
  --shadow: 0 1px 2px rgba(23, 43, 77, .06);
  --hero-a: #ffffff;
  --accent-2: #3b6784; --ink-3: #6b7d93; --focus: rgba(71,121,152,.25); --press: #345c78;
  color-scheme: light;
}
* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 15px; line-height: 1.5;
  padding-inline: max(16px, env(safe-area-inset-left, 0px)) max(16px, env(safe-area-inset-right, 0px));
}
.wrap { max-width: 1120px; margin: 0 auto; padding-block: 20px 56px; }
header.top { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 16px; padding-bottom: 14px; }
header.top h1 { font-family: var(--font-display); font-weight: 600; font-size: 30px; letter-spacing: -0.01em; margin: 0; }
header.top p { margin: 0; color: var(--ink-2); max-width: 60ch; }
.mono { font-family: var(--font-mono); }
nav.tabs {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--bg);
  display: flex; gap: 4px; overflow-x: auto; border-bottom: 1px solid var(--rule); padding-block: 6px; scrollbar-width: thin;
}
nav.tabs button {
  flex: 0 0 auto; background: transparent; color: var(--ink-2); border: 1px solid transparent; border-radius: 8px;
  padding: 8px 12px; font: inherit; font-weight: 500; cursor: pointer; white-space: nowrap;
}
nav.tabs button small { font-family: var(--font-mono); font-size: 11px; opacity: .75; margin-left: 6px; }
nav.tabs button:hover { color: var(--ink); background: var(--surface-2); }
nav.tabs button[aria-selected="true"] { background: var(--accent); color: var(--accent-ink); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
section.panel { padding-top: 18px; display: grid; gap: 18px; }
.lede { color: var(--ink-2); max-width: 72ch; margin: 0; }
.grid2 { display: grid; gap: 18px; grid-template-columns: repeat(auto-fit, minmax(min(100%, 420px), 1fr)); align-items: start; }
.card { background: var(--surface); border: 1px solid var(--rule); border-radius: 8px; padding: 16px; display: grid; gap: 12px; min-width: 0; }
.card h2 { font-family: var(--font-display); font-size: 18px; font-weight: 600; margin: 0; }
.card h3 { font-size: 13px; text-transform: uppercase; letter-spacing: .06em; color: var(--ink-2); margin: 0; font-weight: 600; }
.src { font-family: var(--font-mono); font-size: 12px; color: var(--ink-2); }
label.f { display: grid; gap: 3px; font-size: 13px; color: var(--ink-2); min-width: 0; }
input, select, textarea, button.btn {
  font: inherit; color: var(--ink); background: var(--bg); border: 1px solid var(--rule); border-radius: 8px; padding: 7px 9px; min-width: 0; width: 100%;
}
input[type=number] { font-family: var(--font-mono); }
textarea { font-family: var(--font-mono); font-size: 13px; resize: vertical; min-height: 84px; }
.row { display: flex; flex-wrap: wrap; gap: 10px; align-items: end; }
.row > * { flex: 1 1 110px; }
.row > .fix { flex: 0 0 auto; }
button.btn { width: auto; cursor: pointer; background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: 600; padding: 8px 14px; }
button.btn.ghost { background: transparent; color: var(--accent); }
button.btn:disabled { opacity: .45; cursor: default; }
.out { display: grid; gap: 8px; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); }
.stat { background: var(--surface-2); border-radius: 8px; padding: 8px 10px; min-width: 0; }
.stat b { display: block; font-family: var(--font-mono); font-size: 20px; font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
.stat span { font-size: 12px; color: var(--ink-2); }
ol.steps, ul.steps { margin: 0; padding-left: 20px; font-family: var(--font-mono); font-size: 13px; color: var(--ink-2); display: grid; gap: 3px; }
.tablewrap { overflow-x: auto; border: 1px solid var(--rule); border-radius: 8px; }
table { border-collapse: collapse; width: 100%; font-size: 13px; font-variant-numeric: tabular-nums; }
th, td { text-align: left; padding: 6px 9px; border-bottom: 1px solid var(--rule); vertical-align: top; }
th { background: var(--surface-2); font-weight: 600; font-size: 12px; text-transform: uppercase; letter-spacing: .05em; white-space: nowrap; }
tr:last-child td { border-bottom: 0; }
td.m, th.m { font-family: var(--font-mono); }
.pill { display: inline-block; font-family: var(--font-mono); font-size: 12px; font-weight: 600; padding: 1px 8px; border-radius: 4px; }
.hit, .ok, .exact, .rounding { background: var(--good-soft); color: var(--good); }
.miss, .fail, .FAIL { background: var(--bad-soft); color: var(--bad); }
.fault { background: var(--warn-soft); color: var(--warn); }
.key-discrepancy { background: var(--warn-soft); color: var(--warn); }
.bits { display: flex; border-radius: 8px; overflow: hidden; font-family: var(--font-mono); font-size: 13px; min-height: 52px; border: 1px solid var(--rule); }
.bits div { display: grid; place-items: center; padding: 6px 4px; text-align: center; min-width: 54px; line-height: 1.25; }
.bits .t { background: var(--accent-soft); color: var(--accent); }
.bits .s { background: var(--good-soft); color: var(--good); }
.bits .o { background: var(--warn-soft); color: var(--warn); }
.setgrid { display: grid; gap: 6px; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); }
.set { border: 1px solid var(--rule); border-radius: 8px; padding: 6px 8px; font-family: var(--font-mono); font-size: 12px; background: var(--bg); min-width: 0; }
.set.cur { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent-soft); }
.set.cur.hitc { border-color: var(--good); box-shadow: 0 0 0 2px var(--good-soft); }
.set.cur.missc { border-color: var(--bad); box-shadow: 0 0 0 2px var(--bad-soft); }
.set .w { display: flex; justify-content: space-between; gap: 6px; color: var(--ink-2); }
.set .w b { color: var(--ink); }
.mesi { display: grid; gap: 10px; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); }
.mbox { border: 1px solid var(--rule); border-radius: 8px; padding: 10px; text-align: center; background: var(--bg); }
.mbox b { font-family: var(--font-mono); font-size: 34px; display: block; line-height: 1.1; }
.mbox.M b { color: var(--bad); } .mbox.E b { color: var(--accent); } .mbox.S b { color: var(--good); } .mbox.I b { color: var(--ink-2); }
.mbox span { font-size: 12px; color: var(--ink-2); }
.btns { display: flex; flex-wrap: wrap; gap: 8px; }
.note { font-size: 13px; color: var(--ink-2); border-left: 3px solid var(--rule); padding-left: 10px; margin: 0; }
.flag { background: var(--warn-soft); color: var(--ink); border: 1px solid var(--warn); border-radius: 8px; padding: 8px 10px; font-size: 13px; }
.tally { display: grid; gap: 10px; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); }
.tally .stat.keyd { background: var(--warn-soft); }
.tally .stat.keyd b { color: var(--warn); }
.tally .stat.good { background: var(--good-soft); } .tally .stat.good b { color: var(--good); }
.prob-q { font-size: 16px; max-width: 70ch; margin: 0; }
.ans { display: grid; gap: 10px; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); }
.ans input.right { border-color: var(--good); background: var(--good-soft); }
.ans input.wrong { border-color: var(--bad); background: var(--bad-soft); }
svg text { fill: var(--ink-2); font-family: var(--font-mono); font-size: 11px; }
svg .ax { stroke: var(--rule); } svg .ln { stroke: var(--accent); fill: none; stroke-width: 2; } svg .dot { fill: var(--accent); }
svg .ref { stroke: var(--bad); stroke-dasharray: 4 3; fill: none; }
.chart { width: 100%; height: auto; max-width: 100%; }
@media (prefers-reduced-motion: no-preference) { nav.tabs button { transition: background .12s, color .12s; } }

/* v2 additions */
.stack { display: grid; gap: 18px; }
.cfgs { display: grid; gap: 10px; }
.cfg { border: 1px solid var(--rule); border-radius: 8px; padding: 10px; display: grid; gap: 10px; background: var(--bg); }
.reading { margin: 0; padding-left: 18px; display: grid; gap: 8px; font-size: 14px; }
.nop { color: var(--ink-2); opacity: .6; font-family: var(--font-mono); }
.lede em { font-style: normal; font-weight: 600; color: var(--ink); }
svg .ln2 { stroke: var(--bad); fill: none; stroke-width: 2; } svg .ln3 { stroke: var(--good); fill: none; stroke-width: 2; } svg .ln4 { stroke: var(--warn); fill: none; stroke-width: 2; }
svg .dot.d1 { fill: var(--bad); } svg .dot.d2 { fill: var(--good); } svg .dot.d3 { fill: var(--warn); }
svg .bar { fill: var(--accent-soft); stroke: var(--accent); stroke-width: 1; } svg .bar.best { fill: var(--good-soft); stroke: var(--good); }
.legend { display: flex; flex-wrap: wrap; gap: 14px; font-size: 12px; color: var(--ink-2); font-family: var(--font-mono); }
.legend .sw { display: inline-block; width: 14px; height: 3px; margin-right: 6px; vertical-align: middle; background: var(--accent); }
.legend .sw.s1 { background: var(--bad); } .legend .sw.s2 { background: var(--good); } .legend .sw.s3 { background: var(--warn); }
.tablewrap td input { padding: 4px 6px; }

.dag { overflow-x: auto; }
svg .node { fill: var(--surface-2); stroke: var(--rule); } svg .node.crit { fill: var(--bad-soft); stroke: var(--bad); }
svg .edge { stroke: var(--ink-2); stroke-width: 1.2; } svg .edge.crit { stroke: var(--bad); stroke-width: 2; }
svg .arrow { fill: var(--ink-2); } svg .arrow.crit { fill: var(--bad); }
details.card > summary { cursor: pointer; padding: 2px 0; }
details.card[open] > summary { margin-bottom: 12px; }
.mbox.O b { color: var(--warn); }

.pipe table { width: auto; min-width: 100%; } .pipe th { text-align: center; padding: 6px 7px; } .pipe td { padding: 4px 3px; text-align: center; white-space: nowrap; } .pipe td:first-child { text-align: left; position: sticky; left: 0; background: var(--surface); padding-right: 10px; }
.pc { display: inline-block; min-width: 40px; padding: 2px 4px; border-radius: 8px; font-family: var(--font-mono); font-size: 11px; font-weight: 600; border: 1px solid transparent; }
.pc.IF { background: var(--accent-soft); color: var(--accent); } .pc.ID { background: var(--good-soft); color: var(--good); } .pc.EX { background: var(--warn-soft); color: var(--warn); } .pc.MEM { background: var(--bad-soft); color: var(--bad); } .pc.WB { background: var(--surface-2); color: var(--ink); }
.pc.stall { background: repeating-linear-gradient(45deg, var(--surface-2) 0 4px, var(--bg) 4px 8px); color: var(--ink-2); border: 1px dashed var(--ink-2); }

/* pipeline diagram */
.pdiag { overflow-x: auto; border: 1px solid var(--rule); border-radius: 8px; background: var(--surface); padding: 4px 0 0; }
.pdiag svg { display: block; }
.pdiag .band { fill: var(--surface-2); opacity: .45; }
.pdiag .rowline { stroke: var(--rule); stroke-width: 1; }
.pdiag text.cyc { font-family: var(--font-mono); font-size: 12px; fill: var(--ink-2); } .pdiag text.cyc.head { font-size: 11px; }
.pdiag text.lab { font-family: var(--font-mono); font-size: 13px; fill: var(--ink); } .pdiag .num { fill: var(--accent); font-weight: 600; }
.pdiag .kind { fill: var(--surface-2); } .pdiag .kind.load { fill: var(--warn-soft); } .pdiag .kind.store { fill: var(--bad-soft); } .pdiag .kind.branch, .pdiag .kind.jump { fill: var(--accent-soft); } .pdiag .kind.alu { fill: var(--good-soft); }
.pdiag text.kindt { font-family: var(--font-mono); font-size: 10px; font-weight: 600; fill: var(--ink); }
.pdiag .stg rect { stroke-width: 1.2; } .pdiag .stg text { font-family: var(--font-mono); font-size: 12px; font-weight: 600; }
.pdiag .stg.IF rect, .sw.st.IF { fill: var(--accent-soft); stroke: var(--accent); background: var(--accent-soft); border-color: var(--accent); } .pdiag .stg.IF text { fill: var(--accent); }
.pdiag .stg.ID rect, .sw.st.ID { fill: var(--good-soft); stroke: var(--good); background: var(--good-soft); border-color: var(--good); } .pdiag .stg.ID text { fill: var(--good); }
.pdiag .stg.EX rect, .sw.st.EX { fill: var(--warn-soft); stroke: var(--warn); background: var(--warn-soft); border-color: var(--warn); } .pdiag .stg.EX text { fill: var(--warn); }
.pdiag .stg.MEM rect, .sw.st.MEM { fill: var(--bad-soft); stroke: var(--bad); background: var(--bad-soft); border-color: var(--bad); } .pdiag .stg.MEM text { fill: var(--bad); }
.pdiag .stg.WB rect, .sw.st.WB { fill: var(--surface-2); stroke: var(--ink-2); background: var(--surface-2); border-color: var(--ink-2); } .pdiag .stg.WB text { fill: var(--ink); }
.pdiag .stg.stall rect { fill: var(--bg); stroke-dasharray: 4 3; opacity: .95; } .pdiag .stg.stall text { fill: var(--ink-2); font-style: italic; }
.pdiag .flush rect { fill: none; stroke: var(--ink-2); stroke-dasharray: 3 3; opacity: .6; } .pdiag .flush text { font-family: var(--font-mono); font-size: 10px; fill: var(--ink-2); }
.pdiag .arc { fill: none; stroke-width: 2; } .pdiag .arc.forward { stroke: var(--accent); } .pdiag .arc.stall, .pdiag .arc.stale { stroke: var(--bad); stroke-dasharray: 5 3; }
.pdiag .pm.f { fill: var(--accent); } .pdiag .pm.s { fill: var(--bad); }
.legend.pl { gap: 8px 16px; }
.sw.st { display: inline-block; width: 16px; height: 12px; border-radius: 6px; border: 1px solid; vertical-align: middle; margin-right: 6px; }
.sw.st.stall { background: var(--bg); border-style: dashed; border-color: var(--ink-2); } .sw.st.flushk { background: none; border-style: dotted; border-color: var(--ink-2); }
.legend .sw.ar { width: 18px; height: 0; border-top: 2px solid var(--accent); background: none; } .legend .sw.ar.bad { border-top: 2px dashed var(--bad); }
p.sum { margin: 0; font-size: 15px; }
ul.why { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; font-size: 13px; }
ul.why li { display: flex; flex-wrap: wrap; gap: 6px; align-items: baseline; } ul.why .mono { color: var(--accent); font-weight: 600; }
.nt { padding: 2px 8px; border-radius: 4px; background: var(--surface-2); } .nt.ok { background: var(--accent-soft); color: var(--accent); } .nt.bad { background: var(--bad-soft); color: var(--bad); }
@keyframes flash { from { opacity: .35; transform: translateY(3px); } to { opacity: 1; transform: none; } }
@media (prefers-reduced-motion: no-preference) { #hz-out.flash { animation: flash .28s ease-out; } }

/* diagram v2: fixed label column + scrolling grid, informative stage boxes */
.pwrap { display: flex; border: 1px solid var(--rule); border-radius: 8px; background: var(--surface); overflow: hidden; }
.plabs { flex: 0 0 clamp(150px, 26vw, 230px); border-right: 1px solid var(--rule); background: var(--surface); z-index: 1; }
.phead { display: flex; align-items: flex-end; padding: 0 10px 6px; font-family: var(--font-mono); font-size: 11px; color: var(--ink-2); }
.plab { display: flex; align-items: center; gap: 8px; padding: 0 8px; border-top: 1px solid var(--rule); min-width: 0; }
.plab .pt { font-family: var(--font-mono); font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; } .plab .pt b { color: var(--accent); }
.plab .kind { flex: 0 0 auto; font-family: var(--font-mono); font-size: 9px; font-weight: 600; padding: 2px 5px; border-radius: 8px; background: var(--surface-2); }
.plab .kind.load { background: var(--warn-soft); } .plab .kind.store { background: var(--bad-soft); } .plab .kind.branch, .plab .kind.jump { background: var(--accent-soft); } .plab .kind.alu { background: var(--good-soft); }
.pwrap .pdiag { flex: 1 1 auto; border: 0; border-radius: 0; min-width: 0; padding: 0; }
.pdiag .stg text.sn { font-size: 12px; } .pdiag .stg text.sd { font-size: 9.5px; font-weight: 500; opacity: .85; }
.pdiag .stg.idle rect { stroke-dasharray: 2 3; opacity: .55; } .pdiag .stg.idle text { opacity: .6; }
.sw.st.idle { background: none; border-style: dotted; border-color: var(--ink-2); }

/* ILP gantt */
.gantt { overflow-x: auto; border: 1px solid var(--rule); border-radius: 8px; }
.gantt table { border-collapse: separate; border-spacing: 0; width: max-content; font-size: 12px; }
.gantt th, .gantt td { padding: 0; height: 34px; min-width: 38px; text-align: center; border-right: 1px solid color-mix(in srgb, var(--rule) 55%, transparent); border-bottom: 1px solid color-mix(in srgb, var(--rule) 55%, transparent); font-family: var(--font-mono); font-weight: 600; }
.gantt thead th { color: var(--ink); font-weight: 500; background: var(--surface); }
.gantt th.lab { position: sticky; left: 0; z-index: 2; width: 210px; min-width: 210px; max-width: 210px; overflow: hidden; text-overflow: ellipsis; text-align: left; padding: 0 10px; white-space: nowrap; background: var(--surface); border-right: 2px solid var(--rule); font-weight: 500; }
.gantt th.lab .n { color: var(--accent); font-weight: 700; margin-right: 8px; }
.gantt th.lab i { color: #b5594a; font-style: normal; margin-left: 8px; }
.gantt td.is { background: #d1a94f33; color: var(--ink); box-shadow: inset 0 0 0 1.5px #d1a94f; }
.gantt td.ex { background: #5aa58a33; color: var(--ink); box-shadow: inset 0 1.5px 0 #5aa58a, inset 0 -1.5px 0 #5aa58a; }
.gantt td.ex.f { box-shadow: inset 0 1.5px 0 #5aa58a, inset 0 -1.5px 0 #5aa58a, inset 1.5px 0 0 #5aa58a; }
.gantt td.ex.l { box-shadow: inset 0 1.5px 0 #5aa58a, inset 0 -1.5px 0 #5aa58a, inset -1.5px 0 0 #5aa58a; }
.gantt td.ex.f.l { box-shadow: inset 0 0 0 1.5px #5aa58a; }
.gantt td.wb { background: #b5594a33; color: var(--ink); box-shadow: inset 0 0 0 1.5px #b5594a; }
.gantt td.hold { background: repeating-linear-gradient(45deg, #8b98a922 0 4px, transparent 4px 8px); }
.gantt td.gap { background: color-mix(in srgb, var(--ink) 12%, transparent); }

.gantt th.lab .deps { display: block; font-family: var(--font-body); font-size: 10.5px; opacity: .75; line-height: 1.1; margin-top: -2px; }
.gantt th.lab .deps b { color: var(--accent); }
.gantt th.lab .n { float: left; margin-top: 8px; }
.gantt th.lab .mono, .gantt th.lab .deps { margin-left: 30px; }

/* ═══════════════ design system v8/v9: engineering workbench ═══════════════
   Scale: 4 / 8 / 12 / 16 / 24. Controls 34 px tall. Panels 8 px radius, controls and tags 6 px. One accent. No glow, no lift, no blur. */
body { font-size: 14px; line-height: 1.5; letter-spacing: 0; -webkit-font-smoothing: antialiased; }
.wrap { max-width: 1240px; padding-block: 0 48px; }
.mono, .stat b, input[type=number], td.m, th.m { font-variant-numeric: tabular-nums; }

/* app bar */
.appbar { display: flex; align-items: center; justify-content: space-between; gap: 12px 24px; flex-wrap: wrap; min-height: 56px; padding-block: 10px; background: var(--nav); color: #fff; box-shadow: 0 0 0 100vmax var(--nav); clip-path: inset(0 -100vmax); margin-bottom: 16px; }
.brand { display: flex; align-items: center; gap: 10px; min-width: 0; }
.brand .logo { width: 24px; height: 24px; color: #9fc3da; flex: none; }
.brand h1 { margin: 0; font: 650 19px/1 var(--font-display); letter-spacing: -0.015em; color: #fff; }
.brand .proj { color: rgba(255,255,255,.7); font-size: 13px; padding-left: 12px; border-left: 1px solid rgba(255,255,255,.25); line-height: 1.2; }
.brand .proj b { color: #fff; font-weight: 600; }
.bar-r { display: flex; align-items: center; gap: 14px; }
.hero-chk { margin: 0; font: 500 12px var(--font-mono); gap: 8px; row-gap: 0; flex-wrap: nowrap; white-space: nowrap; color: rgba(255,255,255,.75); }
.appbar .hero-chk b { color: #fff; }
.hero-chk i { width: 8px; height: 8px; border-radius: 50%; }
.appbar .hero-chk.pass i { animation: none; box-shadow: none; background: #6fcf97; opacity: 1; } .appbar .hero-chk.fail i { background: #f08c80; }
.theme { position: static; width: 32px; height: 32px; border-radius: 4px; background: transparent; border: 1px solid rgba(255,255,255,.35); color: #fff; backdrop-filter: none; }
.theme:hover { background: rgba(255,255,255,.1); border-color: #fff; color: #fff; } .theme svg { width: 16px; height: 16px; }

/* overview (the old hero), collapsible, no marketing */
.overview { margin-top: 16px; border: 1px solid var(--rule); border-radius: 6px; background: var(--surface); box-shadow: var(--shadow); }
.overview > summary { list-style: none; cursor: pointer; display: flex; align-items: baseline; gap: 12px; padding: 10px 16px; font-weight: 600; font-size: 13px; user-select: none; }
.overview > summary::-webkit-details-marker { display: none; }
.overview > summary::before { content: ""; width: 7px; height: 7px; border-right: 1.6px solid var(--ink-2); border-bottom: 1.6px solid var(--ink-2); transform: rotate(-45deg); margin-right: 2px; flex: none; align-self: center; }
.overview[open] > summary::before { transform: rotate(45deg); }
.overview > summary em { font-style: normal; font-weight: 400; color: var(--ink-2); font-size: 12.5px; }
.overview[open] > summary { border-bottom: 1px solid var(--rule); }
.overview .hero-in { padding: 16px; gap: 16px 28px; grid-template-columns: minmax(0, 1fr) minmax(0, 1.25fr); align-items: start; }
.overview .sub { margin: 0; font-size: 14px; max-width: 52ch; color: var(--ink-2); }
.hero-chips { margin-top: 14px; display: flex; flex-wrap: wrap; gap: 4px 14px; }
.hero-chips button { all: unset; cursor: pointer; font: 500 12.5px var(--font-body); color: var(--accent); padding: 2px 0; border-bottom: 1px solid transparent; }
.hero-chips button:hover { border-bottom-color: var(--accent); transform: none; }
.hero-viz { background: var(--surface-2); border: 1px solid var(--rule); border-radius: 4px; backdrop-filter: none; padding: 10px 12px 8px; }
@media (max-width: 820px) { .overview .hero-in { grid-template-columns: 1fr; } .brand .proj { display: none; } }

/* tabs: a plain underlined strip */
nav.tabs { margin-top: 0; padding: 0; gap: 0; background: var(--bg); backdrop-filter: none; border-bottom: 1px solid var(--rule); }
nav.tabs button { padding: 12px 14px 11px; border-radius: 0; border-bottom: 2px solid transparent; font-size: 13.5px; font-weight: 500; gap: 7px; color: var(--ink-2); background: transparent; box-shadow: none; }
nav.tabs button svg { width: 15px; height: 15px; opacity: .7; }
nav.tabs button:hover { background: transparent; color: var(--ink); }
nav.tabs button[aria-selected="true"] { background: transparent; color: var(--ink); border-bottom-color: var(--accent); font-weight: 600; box-shadow: none; }
nav.tabs button[aria-selected="true"] svg { opacity: 1; color: var(--accent); }

/* panels and type */
section.panel { padding-top: 16px; gap: 16px; }
.lede { font-size: 14px; color: var(--ink-2); max-width: 78ch; }
.lede em, .lede b, .lede strong { color: var(--ink); }
.card { border-radius: 6px; padding: 16px 18px; box-shadow: var(--shadow); background: var(--surface); }
.card h2 { font: 600 15px/1.3 var(--font-display); font-stretch: normal; letter-spacing: -0.005em; color: var(--ink); }
.card h3 { font: 600 11px var(--font-body); letter-spacing: .07em; text-transform: uppercase; color: var(--ink-2); }
.note { font-size: 12.5px; border-left: 2px solid var(--rule-2); }
.grid2, .stack { gap: 16px; }

/* controls: one height, one radius */
label.f { gap: 4px; font-size: 12px; font-weight: 500; color: var(--ink-2); }
input, select, textarea { min-height: 34px; padding: 6px 10px; border-radius: 4px; background: var(--bg); border: 1px solid var(--rule-2); font-size: 13.5px; transition: border-color .12s; }
input:hover, select:hover, textarea:hover { border-color: var(--ink-2); }
input:focus, select:focus, textarea:focus { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent-soft); }
textarea { font-size: 12.5px; line-height: 1.55; }
button.btn { min-height: 34px; padding: 6px 14px; border-radius: 4px; font-size: 13.5px; font-weight: 600; transition: background .12s, border-color .12s; }
button.btn:hover:not(:disabled) { transform: none; box-shadow: none; filter: brightness(1.08); }
button.btn.ghost { background: transparent; color: var(--ink); border-color: var(--rule-2); }
button.btn.ghost:hover:not(:disabled) { background: var(--surface-3); filter: none; }
.row { gap: 12px; }

/* metrics */
.out, .tally { gap: 8px; }
.stat { border-radius: 4px; background: var(--surface-2); border: 1px solid var(--rule); padding: 10px 12px; }
.stat b { font: 600 20px/1.2 var(--font-mono); letter-spacing: -0.01em; }
.stat span { font: 500 11.5px var(--font-body); letter-spacing: 0; color: var(--ink-2); margin-top: 3px; }
.flash .stat { animation: none; }

/* tables */
table { border-radius: 0; }
.tablewrap, .tw { border-radius: 4px; border: 1px solid var(--rule); }
th { font: 600 11px var(--font-body); letter-spacing: .05em; background: var(--surface-2); color: var(--ink-2); }
td { font-size: 13px; }
tbody tr:hover td { background: var(--surface-2); }

/* status badges: rectangular, quiet */
.pill { font: 600 11.5px var(--font-mono); padding: 1px 7px; border-radius: 4px; letter-spacing: 0; }
.tag, .chip { border-radius: 4px; }
.bits, .set, .mbox, .cfg, .flag, .sy-bar, .chg { border-radius: 4px; }
.set.cur, .set.cur.hitc, .set.cur.missc { box-shadow: none; border-width: 1.5px; }

/* charts */
svg .ln, svg .ln2, svg .ln3, svg .ln4 { stroke-width: 1.75; }
svg .ax { stroke: var(--rule); stroke-width: 1; }
svg text { font-size: 10.5px; }
.legend { gap: 14px; font-size: 12px; }
.legend .sw { border-radius: 2px; }

/* practice: calm, one neutral surface */
.pr-flow { display: flex; flex-wrap: wrap; gap: 4px 20px; grid-template-columns: none; }
.pr-flow li { border: 0; background: transparent; padding: 0; gap: 8px; font-size: 12.5px; color: var(--ink-2); }
.pr-flow li b, .pr-flow li:nth-child(n) b { width: 18px; height: 18px; background: transparent; color: var(--ink-2); border: 1px solid var(--rule-2); border-radius: 50%; font-size: 10.5px; }
.pr-chips { gap: 6px; }
.pr-chip { font: 500 12.5px var(--font-body); height: 28px; padding: 0 10px; border-radius: 4px; border-color: var(--rule-2); background: transparent; color: var(--ink-2); transform: none; }
.pr-chip:hover { transform: none; background: var(--surface-3); color: var(--ink); border-color: var(--rule-2); }
.pr-chip.on, .pr-chip.on:hover { background: var(--accent-soft); color: var(--accent); border-color: var(--accent); font-weight: 600; }
.pr-st { border-radius: 4px; background: var(--surface-2); padding: 10px 12px; }
.pr-st b { font: 600 22px/1.1 var(--font-mono); } .pr-st small { font: 600 10.5px var(--font-body); letter-spacing: .06em; }
.pr-meter { height: 4px; } .pr-meter u { background: var(--accent); }
.pr-dots u { border-radius: 2px; }
.pq { border-top: 1px solid var(--rule); }
.pq .pq-bar, .pq-bar { display: none; }
.pq-head { padding-bottom: 10px; border-bottom: 1px solid var(--rule); }
.pq-head h2::before { display: none; }
.pq-head h2 { font-size: 16px; }
.pq-no { border-radius: 4px; font: 500 11px var(--font-mono); background: transparent; }
.pq-fact, .pq-fact:nth-child(n) { border-top: 1px solid var(--rule); border-radius: 4px; padding: 6px 10px; background: var(--surface-2); }
.pq-fact b { font-size: 12.5px; } .pq-fact small { letter-spacing: .05em; }
.pq-prog { border-radius: 4px; }
.rg { border-radius: 3px; padding: 0 5px; }
.pq-stmt { border-left: 2px solid var(--accent); background: var(--surface-2); border-radius: 0 4px 4px 0; font-size: 14.5px; line-height: 1.65; padding: 12px 16px; }
.pq-stmt .nm { background: var(--surface-3); border-radius: 3px; padding: 0 5px; font-weight: 600; }
.pq-ask { font: 600 14.5px/1.4 var(--font-body); }
.pq-in .f input { font: 600 17px var(--font-mono); padding: 8px 12px; min-height: 42px; border-radius: 4px; }
.pq-in .f.pq-right input { box-shadow: none; } .pq-in .f.pq-wrong input { box-shadow: none; }
.pq.pq-win { animation: none; border-color: var(--good); }
.pq-next { animation: none; }
.pq-hints { border-left-width: 2px; border-radius: 0 4px 4px 0; }
.gantt .gc, .gc { border-radius: 3px; } .gantt .gc { height: 26px; }
.gkey .gc { border-radius: 3px; }
/* diagrams: modest corners so boxes read as parts, not buttons */
svg rect { rx: 4px; ry: 4px; }

/* v8 polish: uniform small radii for rows, chips and badges */
.ir { border-radius: 4px; padding: 2px 8px; }
.ir .kd { border-radius: 3px; } .ir .ib button { border-radius: 4px; }
.chip, .pal .chip, .pd-z .chip, .tag { border-radius: 4px; }
.pal .chip, .pd-z .chip, .chip { font-size: 12px; padding: 3px 9px; }
.seg, .seg button { border-radius: 4px; } .seg button { border-radius: 5px; }
@media (max-width: 560px) {
  .overview > summary em { display: none; }
  .ir { gap: 4px; padding: 2px 6px; } .ir .ib button { padding: 3px 3px; }
  .hero-chk span { display: none; }
}
/* v10: callouts are neutral so they never read as alerts */
.chg, .eq { background: var(--accent-soft); border-left: 2px solid var(--accent); border-radius: 0 4px 4px 0; }
.fp-read { background: var(--surface-2); }
/* v10: primary actions use the palette steel blue */
button.btn:not(.ghost) { background: var(--accent-2); border-color: var(--accent-2); color: #fff; }
button.btn:not(.ghost):hover:not(:disabled) { background: var(--accent); border-color: var(--accent); color: #0b1120; filter: none; }
.card h3, th { color: var(--slate); }

/* v11 muted labels */
.card label, .pr-st small, .stat small, .stat .l, .hero-chk span { color: var(--ink-3); }
:root[data-theme="light"] .card label, :root[data-theme="light"] .pr-st small, :root[data-theme="light"] .stat small { color: var(--ink-2); }
/* v11 dark-mode header/tab colours */
:root:not([data-theme="light"]) .appbar { border-bottom: 1px solid var(--rule); box-shadow: 0 0 0 100vmax var(--nav); }
:root:not([data-theme="light"]) nav.tabs button[aria-selected="true"] { color: var(--accent); }

/* ═══════════════ v11 motion ═══════════════ */
@media (prefers-reduced-motion: no-preference) {
  :root { --ease-out: cubic-bezier(.2, .7, .2, 1); --ease-io: cubic-bezier(.4, 0, .2, 1); }
  /* initial appearance */
  @keyframes al-fade { from { opacity: 0; } to { opacity: 1; } }
  @keyframes al-rise { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
  @keyframes al-pop { from { opacity: 0; transform: translateY(-4px); } to { opacity: 1; transform: none; } }
  @keyframes al-upd { from { background-color: var(--accent-soft); } }
  body { animation: al-fade .22s var(--ease-out) both; }
  /* panel / tab content */
  section.panel:not([hidden]) { animation: al-rise .26s var(--ease-out) both; }
  .overview[open] > :not(summary) { animation: al-rise .22s var(--ease-out) both; }
  details[open] > :not(summary) { animation: al-fade .2s var(--ease-out) both; }
  /* results that were just re-computed */
  .stat, .pill, .chg, .eq { animation: al-fade .2s var(--ease-out) both; }
  .pq-hints li, #pr-steps > * { animation: al-rise .22s var(--ease-out) both; }
  /* buttons, tabs, controls */
  button, .btn, .chip, .seg button, nav.tabs button, .theme, summary { transition: background-color .15s var(--ease-io), border-color .15s var(--ease-io), color .15s var(--ease-io), transform .12s var(--ease-out); }
  button.btn:hover:not(:disabled), .chip:hover, .seg button:hover { transform: translateY(-1px); }
  button:active:not(:disabled), .btn:active:not(:disabled), .chip:active, .seg button:active, nav.tabs button:active { transform: translateY(0) scale(.98); }
  nav.tabs button { border-bottom-color: transparent; }
  input, select, textarea { transition: border-color .18s var(--ease-io), box-shadow .18s var(--ease-io), background-color .18s var(--ease-io); }
  input:focus, select:focus, textarea:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--focus); }
  /* tables and rows */
  tr, .ir, .pr-chip { transition: background-color .15s var(--ease-io), border-color .15s var(--ease-io); }
  /* diagrams: transitions only fire when the model changes state */
  .hv-c rect, .pd-c rect, .cc-s rect, .pblk .blk rect, .pd-col { transition: fill .22s var(--ease-io), stroke .22s var(--ease-io), fill-opacity .22s var(--ease-io), opacity .22s var(--ease-io), stroke-width .22s var(--ease-io); }
  .hv-c, .pd-c, .cc-s { transition: opacity .22s var(--ease-io); }
  /* chart marks that appear with new data */
  svg .ln, svg .ln2, svg .ln3, svg .ln4 { stroke-dasharray: none; }
  svg .bar { transform-box: fill-box; transform-origin: bottom; animation: al-bar .3s var(--ease-out) both; }
  @keyframes al-bar { from { transform: scaleY(.6); opacity: .4; } to { transform: none; opacity: 1; } }
  .pr-meter > *, .pr-dots > * { transition: width .3s var(--ease-io), background-color .2s var(--ease-io); }
  .pq-right, .pq-wrong { animation: al-upd .4s var(--ease-out); }

  .hero-chk.run i { animation: hk 1.6s ease-out infinite; }
}
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }

/* ═══════════════ v12: darker surfaces (dark theme only) ═══════════════ */
:root:not([data-theme="light"]) body { background: var(--bg); }
:root:not([data-theme="light"]) .appbar { background: var(--nav); border-bottom: 1px solid var(--rule); }
:root:not([data-theme="light"]) nav.tabs { background: var(--nav); }
:root:not([data-theme="light"]) nav.tabs button:hover { background: var(--hover); }
:root:not([data-theme="light"]) nav.tabs button[aria-selected="true"] { background: var(--sel); color: var(--accent); border-bottom-color: var(--accent); }
:root:not([data-theme="light"]) input, :root:not([data-theme="light"]) select, :root:not([data-theme="light"]) textarea { background: var(--input); border-color: var(--rule); color: var(--ink); }
:root:not([data-theme="light"]) input:hover, :root:not([data-theme="light"]) select:hover, :root:not([data-theme="light"]) textarea:hover { border-color: var(--rule-2); }
:root:not([data-theme="light"]) select option { background: var(--input); color: var(--ink); }
:root:not([data-theme="light"]) button:not(.btn):not(.theme):not([aria-selected]):hover:not(:disabled) { background: var(--hover); }
:root:not([data-theme="light"]) .ir { background: var(--input); border-color: var(--rule); }
:root:not([data-theme="light"]) .ir:hover, :root:not([data-theme="light"]) .ir:focus-within { background: var(--work); border-color: var(--rule-2); }
:root:not([data-theme="light"]) .overview { background: var(--surface); border-color: var(--rule); }
:root:not([data-theme="light"]) .card { box-shadow: none; }
:root:not([data-theme="light"]) .card .card, :root:not([data-theme="light"]) .cache-row, :root:not([data-theme="light"]) details > summary + * { border-color: var(--rule); }
:root:not([data-theme="light"]) .gantt, :root:not([data-theme="light"]) table { border-color: var(--rule); }
:root:not([data-theme="light"]) .chg, :root:not([data-theme="light"]) .eq { background: var(--sel); border-left-color: var(--accent-2); }
:root:not([data-theme="light"]) .hv-c rect, :root:not([data-theme="light"]) .pd-c rect, :root:not([data-theme="light"]) .cc-s:not(.on) rect { filter: brightness(.88) saturate(.9); }
:root:not([data-theme="light"]) .sy-seg, :root:not([data-theme="light"]) .sy-dot { filter: brightness(.86) saturate(.92); }

/* ═══════════════ v13: motion tied to real state (no colour changes) ═══════════════ */
@media (prefers-reduced-motion: no-preference) {
  /* tab indicator: the underline grows from the centre when a tab becomes the active one */
  nav.tabs button { position: relative; }
  nav.tabs button, nav.tabs button[aria-selected="true"] { border-bottom-color: transparent; }
  nav.tabs button::after { content: ""; position: absolute; left: 0; right: 0; bottom: -3px; height: 3px; background: var(--accent); transform: scaleX(0); transform-origin: 50% 50%; transition: transform .22s var(--ease-io); pointer-events: none; }
  nav.tabs button[aria-selected="true"]::after { transform: scaleX(1); }
  nav.tabs button svg { transition: opacity .15s var(--ease-io); }
  nav.tabs button[aria-selected="true"] svg { opacity: 1; }

  /* collapsible sections animate their height where the browser supports it */
  @supports selector(::details-content) {
    details { interpolate-size: allow-keywords; }
    details::details-content { block-size: 0; overflow: clip; opacity: 0; transition: block-size .24s var(--ease-io), opacity .2s var(--ease-out), content-visibility .24s allow-discrete; }
    details[open]::details-content { block-size: auto; opacity: 1; }
    details[open] > :not(summary), .overview[open] > :not(summary) { animation: none; }
  }
  summary::marker { transition: transform .2s; }

  /* pipeline timeline: cells enter from the left as playback reveals each real cycle */
  g.pd-c { transform-box: fill-box; transform-origin: 0 50%; transition: opacity .24s var(--ease-out), transform .24s var(--ease-out); }
  g.pd-c.fut { transform: translateX(-5px); }
  .pd-col { transition: fill-opacity .2s var(--ease-io), opacity .2s var(--ease-io); }
  .pd-h { transition: fill .2s var(--ease-io); }
  /* dependency lines: forwarding and stall links related to the selected instruction draw a slow directional dash */
  @keyframes al-flow { to { stroke-dashoffset: -16; } }
  .pd-in.hasSel .pd-fw.rl { stroke-dasharray: 6 4; animation: al-flow 1.4s linear infinite; }
  .pd-in.hasSel .pd-sw.rl, .pd-in.hasSel .pd-fl.rl, .pd-in.hasSel .pd-fs.rl { animation: al-flow 1.8s linear infinite; }
  .pd-fw, .pd-sw, .pd-fl, .pd-fs { transition: opacity .2s var(--ease-io); }
  .pd-in.hasSel .pd-c, [data-r] { transition: opacity .2s var(--ease-io), transform .24s var(--ease-out); }

  /* cache controller: states and edges on the selected access's path settle in when they are entered */
  @keyframes al-enter { from { fill-opacity: 0; stroke-opacity: .3; } }
  @keyframes al-edge { from { stroke-opacity: .25; } }
  .cc-s.on rect { animation: al-enter .3s var(--ease-out) both; }
  .cc-e.on { animation: al-edge .3s var(--ease-out) both; }
  .cc-n.on { animation: al-fade .25s var(--ease-out) both; }
  /* cache results: hit settles quickly, miss holds its highlight a little longer */
  @keyframes al-hit { from { background-color: var(--good); color: var(--bg); } }
  @keyframes al-miss { 0% { background-color: var(--bad); color: var(--bg); } 60% { background-color: var(--bad); color: var(--bg); } }

  /* whole-processor stack and bars */
  .sy-seg, .sy-dot, .il-bar { transition: filter .2s var(--ease-io), opacity .2s var(--ease-io); }
  .sy-seg:hover { filter: brightness(1.12); }
  /* result tiles update softly when a value is recomputed */
  .stat b, .stat strong, .pr-st b { transition: color .2s var(--ease-io); }
  .pr-chip[aria-pressed="true"], .pr-chip.on, .pr-chip.sel { transition: background-color .18s var(--ease-io), color .18s var(--ease-io); }
}

}

.overview .hero-chips .c-cache { --cc: var(--o-blue); } .overview .hero-chips .c-pipe { --cc: var(--o-green); } .overview .hero-chips .c-ilp { --cc: var(--o-amber); }

.fp-bar { display: flex; gap: 4px; margin: 4px 0 8px; height: 26px; }
.fp-bar span { display: flex; align-items: center; justify-content: center; gap: 5px; border-radius: 6px; font: 600 11px var(--font-mono); color: var(--ink-2); border: 1.5px dashed var(--rule); background: transparent; transition: background .3s, border-color .3s, color .3s; min-width: 0; white-space: nowrap; overflow: hidden; }

<script>
/* ArchLab engines — BAEVD202 Computer Architecture
 * Pure functions, no DOM. Works in Node (module.exports) and in the browser (window.ArchLab).
 * Every function returns { result..., steps:[...] } so the UI can show the working.
 */
(function (root) {
  'use strict';
  const log2 = (x) => Math.log2(x);
  const isPow2 = (x) => Number.isInteger(x) && x > 0 && (x & (x - 1)) === 0;
  const r = (x, d = 4) => Math.round(x * 10 ** d) / 10 ** d;

  /* ───────────── Module 1: performance metrics ───────────── */
  // mix: [{name, count (millions), cpi}]
  function cpiFromMix(mix) {
    const total = mix.reduce((s, m) => s + m.count, 0);
    const cycles = mix.reduce((s, m) => s + m.count * m.cpi, 0);
    return { cpi: cycles / total, totalCount: total, totalCycles: cycles };
  }
  // fMHz, count in millions -> MIPS, time in seconds
  function machinePerf(mix, fMHz) {
    const { cpi, totalCount, totalCycles } = cpiFromMix(mix);
    const mips = fMHz / cpi;
    const timeSec = totalCycles / fMHz; // millions cycles / MHz = seconds
    return {
      cpi, mips, timeSec, totalCount, totalCycles,
      steps: [
        `CPI = Σ(count×CPI)/Σcount = ${r(totalCycles, 3)} / ${r(totalCount, 3)} = ${r(cpi, 4)}`,
        `MIPS = f(MHz)/CPI = ${fMHz} / ${r(cpi, 4)} = ${r(mips, 3)}`,
        `T = Σcycles / f = ${r(totalCycles, 3)}M / ${fMHz}MHz = ${r(timeSec * 1000, 3)} ms`,
      ],
    };
  }
  // exec times t[prog][machine]; all programs same instruction count I (=1 normalised)
  function meanRates(times) {
    const nProg = times.length, nMach = times[0].length;
    const out = [];
    for (let m = 0; m < nMach; m++) {
      const rates = times.map((row) => 1 / row[m]); // MIPS ∝ 1/t when I is equal
      const am = rates.reduce((a, b) => a + b, 0) / nProg;
      const hm = nProg / rates.reduce((a, b) => a + 1 / b, 0);
      const gm = Math.exp(rates.reduce((a, b) => a + Math.log(b), 0) / nProg);
      out.push({ rates, am, hm, gm });
    }
    const rank = (key) => {
      const order = out.map((o, i) => [o[key], i]).sort((a, b) => b[0] - a[0]);
      const ranks = new Array(nMach);
      order.forEach(([, i], pos) => (ranks[i] = pos + 1));
      return ranks;
    };
    return { machines: out, rankAM: rank('am'), rankHM: rank('hm'), rankGM: rank('gm') };
  }
  function amdahl(f, k) {
    const s = 1 / ((1 - f) + f / k);
    return { speedup: s, limit: f >= 1 ? Infinity : 1 / (1 - f),
      steps: [`Speedup = 1 / ((1−f) + f/k) = 1 / (${r(1 - f)} + ${r(f)}/${k}) = ${r(s, 4)}`,
              `Upper bound (k→∞) = 1/(1−f) = ${f >= 1 ? '∞' : r(1 / (1 - f), 4)}`] };
  }
  function pipelineTime(k, n, tau = 1) {
    const T = (k + n - 1) * tau, Tseq = n * k * tau;
    return { T, Tseq, speedup: Tseq / T,
      steps: [`T(k,n) = (k+n−1)τ = (${k}+${n}−1)×${tau} = ${T}`, `Unpipelined = nkτ = ${Tseq}`, `Speedup = ${r(Tseq / T, 4)}`] };
  }
  // Six-stage pipeline (FI DI CO FO EI WO), no prediction: branch at instr b (1-based) resolves at end of EI,
  // target instruction fetched in the next clock. Returns clock in which `target` completes WO.
  function branchCompletion(k, branchIdx, targetIdx, stageResolve = 5) {
    const branchFetch = branchIdx;                         // instr i fetched at clock i
    const resolveClock = branchFetch + stageResolve - 1;   // clock in which branch is in EI
    const targetFetch = resolveClock + 1;
    const targetDone = targetFetch + k - 1;
    return { branchFetch, resolveClock, targetFetch, targetDone,
      steps: [`Branch (I${branchIdx}) fetched in clock ${branchFetch}, executes (stage ${stageResolve}) in clock ${resolveClock}`,
              `Target I${targetIdx} fetched in clock ${targetFetch}`,
              `Target completes stage ${k} in clock ${targetFetch}+${k}−1 = ${targetDone}`] };
  }

  /* ───────────── Module 2: cache ───────────── */
  // Address format. Provide any consistent set; sizes in bytes/words/blocks.
  function addressFormat({ memBytes, cacheBytes, lineBytes, ways }) {
    if (![memBytes, cacheBytes, lineBytes, ways].every(isPow2)) throw new Error('All sizes must be powers of two');
    const addrBits = log2(memBytes), offset = log2(lineBytes);
    const lines = cacheBytes / lineBytes, sets = lines / ways;
    if (!Number.isInteger(sets) || sets < 1) throw new Error('Cache too small for this line size / associativity');
    const setBits = log2(sets), tag = addrBits - setBits - offset;
    if (tag < 0) throw new Error('Address too small');
    return { addrBits, tag, set: setBits, offset, lines, sets,
      steps: [`Address bits = log2(${memBytes}) = ${addrBits}`, `Offset = log2(${lineBytes}) = ${offset}`,
              `Lines = ${cacheBytes}/${lineBytes} = ${lines};  Sets = ${lines}/${ways} = ${sets} → Set bits = ${setBits}`,
              `Tag = ${addrBits} − ${setBits} − ${offset} = ${tag}`] };
  }
  // Course style (Stallings): memory of 2^s blocks, w words per block, cache m lines, k lines/set
  function addressFormatBlocks({ blocksLog2s, wordsPerBlock, lines, ways }) {
    const w = log2(wordsPerBlock), sets = lines / ways, d = log2(sets), tag = blocksLog2s - d;
    return { tag, set: d, offset: w, steps: [`w = log2(${wordsPerBlock}) = ${w}`, `d = log2(${lines}/${ways}) = ${d}`, `tag = s − d = ${blocksLog2s} − ${d} = ${tag}`] };
  }

  // Generic cache simulator with step trace. cfg: {cacheBytes,lineBytes,ways,policy:'LRU'|'FIFO', writePolicy}
  class Cache {
    constructor(cfg) {
      this.cfg = Object.assign({ policy: 'LRU' }, cfg);
      const { cacheBytes, lineBytes, ways } = this.cfg;
      this.sets = cacheBytes / lineBytes / ways;
      this.offsetBits = log2(lineBytes);
      this.setBits = log2(this.sets);
      this.lines = Array.from({ length: this.sets }, () => []); // each: array of {tag, dirty}; order = recency/insertion
      this.stats = { hits: 0, misses: 0, evictions: 0, dirtyEvictions: 0 };
    }
    decompose(addr) {
      const offset = addr % this.cfg.lineBytes;
      const block = Math.floor(addr / this.cfg.lineBytes);
      return { offset, set: block % this.sets, tag: Math.floor(block / this.sets), block };
    }
    access(addr, isWrite = false) {
      const { set, tag, offset } = this.decompose(addr);
      const ways = this.lines[set];
      const idx = ways.findIndex((l) => l.tag === tag);
      let hit = idx >= 0, evicted = null;
      if (hit) {
        this.stats.hits++;
        const line = ways[idx];
        if (isWrite) line.dirty = true;
        if (this.cfg.policy === 'LRU') { ways.splice(idx, 1); ways.push(line); } // move to MRU end
      } else {
        this.stats.misses++;
        if (ways.length >= this.cfg.ways) {
          evicted = ways.shift(); // front = LRU (LRU) or oldest (FIFO)
          this.stats.evictions++;
          if (evicted.dirty) this.stats.dirtyEvictions++;
        }
        ways.push({ tag, dirty: !!isWrite });
      }
      return { hit, set, tag, offset, evicted, wayTags: ways.map((l) => l.tag) };
    }
    get hitRate() { const n = this.stats.hits + this.stats.misses; return n ? this.stats.hits / n : 0; }
  }
  // Direct cache for a list of addresses -> per-access steps
  function runTrace(cfg, addrs) {
    const c = new Cache(cfg); const rows = [];
    addrs.forEach((a) => { const x = c.access(a); rows.push(Object.assign({ addr: a }, x)); });
    return { rows, hits: c.stats.hits, misses: c.stats.misses, hitRate: c.hitRate, stats: c.stats };
  }
  // Matmul trace used in the project: per (i,j): for k: read A[i][k], read B[k][j]; then write C[i][j]
  function matmulStats(N, cfg, elem = 4) {
    const c = new Cache(cfg);
    const A = 0, B = N * N * elem, C = 2 * N * N * elem;
    for (let i = 0; i < N; i++) for (let j = 0; j < N; j++) {
      for (let k = 0; k < N; k++) { c.access(A + (i * N + k) * elem); c.access(B + (k * N + j) * elem); }
      c.access(C + (i * N + j) * elem, true);
    }
    const n = c.stats.hits + c.stats.misses;
    return { accesses: n, hits: c.stats.hits, misses: c.stats.misses, hitRate: c.hitRate };
  }

  function amat(hitTime, missRate, missPenalty) { return { amat: hitTime + missRate * missPenalty }; }
  // Mean time to access, multi-level (course formula). levels: [{h, t}] where t = TOTAL time of path to a hit in that level, h = conditional hit ratio. Last level h should be 1.
  function meanAccessTime(levels) {
    let reach = 1, Ts = 0; const steps = [];
    levels.forEach((L, i) => {
      const p = reach * L.h; Ts += p * L.t;
      steps.push(`Level ${i + 1}: P = ${r(p, 6)}, t = ${L.t} → contributes ${r(p * L.t, 6)}`);
      reach *= 1 - L.h;
    });
    steps.push(`Ts = ${r(Ts, 6)}`);
    return { Ts, steps };
  }
  // Timing equations from "Cache performance models"
  function cacheTiming(kind, { trl, tct, txb, FP = 0 }) {
    switch (kind) {
      case 'direct': return { thit: trl + txb + tct, tmiss: trl + tct };
      case 'direct-spec': return { thit: trl + txb, tmiss: trl + tct };
      case 'fully': return { thit: trl + txb + tct, tmiss: tct };
      case 'set': return { thit: trl + txb + tct, tmiss: trl + tct };
      case 'set-wp': return { thit: trl + txb + (1 - FP) * tct, tmiss: trl + tct };
      default: throw new Error('unknown mapping');
    }
  }
  // Memory traffic (bytes/instruction). Slide convention (Cache problem solving): WT write traffic = writeFrac × wordBytes;
  // WB write traffic = miss × dirty × wordBytes (single word written back, as the problem states).
  function memTraffic({ lineBytes, wordBytes, miss, dirty, writeFrac }) {
    const read = miss * lineBytes;
    const wt = writeFrac * wordBytes, wb = miss * dirty * wordBytes;
    return { read, wtWrite: wt, wtTotal: read + wt, wbWrite: wb, wbTotal: read + wb };
  }
  // Break-even number of writes for write-back vs write-through (slide: Tw per word, line of L words written back whole)
  function writeBreakEven(L) { return { n: L, rule: `write-back wins when n > ${L}` }; }

  /* ───────────── Module 2: virtual memory ───────────── */
  function translate(pageTable, pageSize, va) {
    const vpn = Math.floor(va / pageSize), offset = va % pageSize;
    const e = pageTable[vpn];
    if (!e) return { va, vpn, offset, fault: true, reason: 'VPN outside page table', steps: [`VPN = ⌊${va}/${pageSize}⌋ = ${vpn}`, 'No entry → fault'] };
    if (!e.v) return { va, vpn, offset, fault: true, reason: 'valid bit = 0', steps: [`VPN = ⌊${va}/${pageSize}⌋ = ${vpn}`, 'Valid bit = 0 → page fault'] };
    const pa = e.pfn * pageSize + offset;
    return { va, vpn, offset, pfn: e.pfn, pa, fault: false,
      steps: [`VPN = ⌊${va}/${pageSize}⌋ = ${vpn};  offset = ${va} mod ${pageSize} = ${offset}`, `Valid = 1, PFN = ${e.pfn}`, `PA = PFN×S + offset = ${e.pfn}×${pageSize} + ${offset} = ${pa}`] };
  }
  // Page replacement with full step trace. policy: FIFO | LRU | OPT
  function pageReplace(refs, frames, policy = 'FIFO') {
    const mem = []; // for FIFO: insertion order; LRU: recency order (front = victim)
    const rows = []; let faults = 0;
    refs.forEach((p, t) => {
      const idx = mem.indexOf(p); let status, replaced = null;
      if (idx >= 0) {
        status = 'Hit';
        if (policy === 'LRU') { mem.splice(idx, 1); mem.push(p); }
      } else {
        faults++; status = 'Fault';
        if (mem.length >= frames) {
          let vi = 0;
          if (policy === 'OPT') {
            let far = -1;
            mem.forEach((q, i) => { const nx = refs.indexOf(q, t + 1); const d = nx < 0 ? Infinity : nx; if (d > far) { far = d; vi = i; } });
          }
          replaced = mem.splice(vi, 1)[0];
        }
        mem.push(p);
      }
      rows.push({ ref: p, frames: mem.slice(), status, replaced, transfers: faults });
    });
    return { rows, faults, hits: refs.length - faults, hitRatio: (refs.length - faults) / refs.length };
  }
  // Slide-style display: FIFO frame positions are stable (replacement takes the victim's slot)
  function pageReplaceSlots(refs, frames, policy = 'FIFO') {
    const slots = new Array(frames).fill(null); const order = []; const rows = []; let faults = 0;
    refs.forEach((p) => {
      const at = slots.indexOf(p); let status, replaced = null;
      if (at >= 0) { status = 'Hit'; if (policy === 'LRU') { order.splice(order.indexOf(p), 1); order.push(p); } }
      else {
        faults++; status = 'Fault';
        const empty = slots.indexOf(null);
        if (empty >= 0) { slots[empty] = p; }
        else { replaced = order.shift(); slots[slots.indexOf(replaced)] = p; }
        order.push(p);
      }
      rows.push({ ref: p, slots: slots.slice(), status, replaced, transfers: faults });
    });
    return { rows, faults };
  }
  function hitRatioCurve(refs, maxFrames, policy = 'LRU') {
    const out = [];
    for (let n = 1; n <= maxFrames; n++) { const x = pageReplace(refs, n, policy); out.push({ frames: n, hits: x.hits, hitRatio: x.hitRatio }); }
    return out;
  }
  // Three-level average access time: cache -> main memory -> disk (Practice problem 4)
  function vmAccessTime({ hCache, hMem, tCache, tMemToCache, tDisk, tDiskToCache }) {
    const p1 = hCache, t1 = tCache;
    const p2 = (1 - hCache) * hMem, t2 = tMemToCache + tCache;
    const p3 = (1 - hCache) * (1 - hMem), t3 = tDisk + tDiskToCache + tCache;
    const T = p1 * t1 + p2 * t2 + p3 * t3;
    return { T, steps: [`Case 1: P=${r(p1, 6)}, T=${t1}`, `Case 2: P=${r(p2, 6)}, T=${t2}`, `Case 3: P=${r(p3, 6)}, T=${t3}`, `T = ${r(T, 4)}`] };
  }
  // Simple TLB (LRU) + effective access time (not in the keys; shown for teaching)
  function tlbSim(vpns, entries) {
    const tlb = []; let hits = 0; const rows = [];
    vpns.forEach((v) => {
      const i = tlb.indexOf(v); const hit = i >= 0;
      if (hit) { hits++; tlb.splice(i, 1); tlb.push(v); } else { if (tlb.length >= entries) tlb.shift(); tlb.push(v); }
      rows.push({ vpn: v, hit, tlb: tlb.slice() });
    });
    return { rows, hits, hitRatio: hits / vpns.length };
  }
  function tlbEAT({ hTLB, tTLB, tMem, levels = 1 }) {
    const hit = tTLB + tMem, miss = tTLB + levels * tMem + tMem;
    return { eat: hTLB * hit + (1 - hTLB) * miss };
  }

  /* ───────────── Module 4: MESI ───────────── */
  // state per cache: 'M'|'E'|'S'|'I'. ops: {cpu: 0..n-1, op:'R'|'W'}
  function mesiRun(nCpu, ops) {
    let st = new Array(nCpu).fill('I'); let mem = 'valid'; let version = 0; // version of line contents
    const val = new Array(nCpu).fill(null); let memVal = 0;
    const rows = [];
    ops.forEach(({ cpu, op }) => {
      const before = st.slice(); const acts = [];
      const others = [...Array(nCpu).keys()].filter((i) => i !== cpu);
      if (op === 'R') {
        if (st[cpu] !== 'I') acts.push('Read hit — no bus activity');
        else {
          const mod = others.find((i) => st[i] === 'M');
          const shared = others.filter((i) => st[i] === 'S' || st[i] === 'E');
          if (mod !== undefined) {
            acts.push(`P${mod + 1} snoops: holds M → supplies line, memory updated, P${mod + 1} M→S`);
            memVal = val[mod]; val[cpu] = val[mod]; st[mod] = 'S'; st[cpu] = 'S';
          } else if (shared.length) {
            shared.forEach((i) => { st[i] = 'S'; });
            acts.push(`Shared signal from ${shared.map((i) => 'P' + (i + 1)).join(', ')} (E→S where needed); memory supplies line`);
            val[cpu] = memVal; st[cpu] = 'S';
          } else { acts.push('No other copy → memory supplies line, I→E'); val[cpu] = memVal; st[cpu] = 'E'; }
        }
      } else {
        if (st[cpu] === 'M') acts.push('Write hit in M — local update, no bus');
        else if (st[cpu] === 'E') { acts.push('Write hit in E — silent E→M'); st[cpu] = 'M'; }
        else if (st[cpu] === 'S') {
          acts.push('Write hit in S — bus invalidate (upgrade), others S→I');
          others.forEach((i) => { if (st[i] !== 'I') st[i] = 'I'; }); st[cpu] = 'M';
        } else {
          const mod = others.find((i) => st[i] === 'M');
          if (mod !== undefined) { acts.push(`Write miss (RWITM): P${mod + 1} holds M → writes back, M→I; then line fetched`); memVal = val[mod]; val[cpu] = memVal; st[mod] = 'I'; }
          else { acts.push('Write miss (RWITM): memory supplies line; other copies invalidated'); val[cpu] = memVal; }
          others.forEach((i) => { st[i] = 'I'; }); st[cpu] = 'M';
        }
        version++; val[cpu] = version; // new data in writer's cache
      }
      const memState = rows.length ? null : null;
      rows.push({ cpu, op, before, after: st.slice(), actions: acts, memStale: st.includes('M'), values: val.slice(), memVal });
    });
    return { rows, final: st };
  }

  /* ───────────── Module 1/3: hazards + renaming ───────────── */
  // inst: {op, dst: 'R1'|null, src: ['R2','R4']}
  const TWO_OP = new Set(['add', 'sub', 'mul', 'div', 'and', 'or', 'xor', 'inc', 'dec', 'comp', 'not', 'neg', 'shl', 'shr']);
  const STORES = new Set(['st', 'sw', 'sd', 'store']);
  function parseInst(text) {
    // accepts "R1 = R2 + R4", "R1 = 100", "R3 <- R3 op R5", "ADD R1,R2,R3" (destination first), "Load R1, A", "Store R1, A"
    const clean = String(text).replace(/\/[^/]*\//g, '').trim();
    const regs = (clean.match(/\bR\d+\b/gi) || []).map((x) => x.toUpperCase());
    const hasAssign = /=|←|<-/.test(clean);
    const mm = clean.match(/^\s*(?:I\d+\s*:)?\s*([A-Za-z]+)\b/);
    if (!hasAssign && mm) {
      const op = mm[1].toLowerCase();
      if (STORES.has(op)) return { text, op, dst: null, src: regs };
      let src = regs.slice(1);
      if (TWO_OP.has(op) && regs.length && !src.includes(regs[0])) src = [regs[0]].concat(src);
      return { text, op, dst: regs[0] || null, src };
    }
    const parts = clean.replace(/^\s*I\d+\s*:/i, '').split(/=|←|<-/);
    const lhs = (parts[0].match(/\bR\d+\b/i) || [null])[0];
    const rhs = parts.slice(1).join('=');
    const src = (rhs.match(/\bR\d+\b/gi) || []).map((x) => x.toUpperCase());
    const o = rhs.match(/\bop\b|[+\-*\/]/i);
    return { text, op: o ? o[0].toLowerCase() : 'mov', dst: lhs ? lhs.toUpperCase() : null, src };
  }
  function findHazards(insts) {
    const raw = [], war = [], waw = [];
    insts.forEach((ins, j) => {
      ins.src.forEach((reg) => {
        for (let i = j - 1; i >= 0; i--) if (insts[i].dst === reg) { raw.push({ from: i + 1, to: j + 1, reg }); break; }
      });
      if (ins.dst) {
        // WAR: earlier instruction reads reg whose NEXT writer is j

  /* ---- 5-stage pipeline hazards: cycle-by-cycle reference with real stage latches ---- */
  function refPipe(prog, forwarding, unified) {
    let IF = null, ID = null, EX = null, MEM = null, WB = null, next = 0, t = 1, lastWB = 0;
    const isMem = (i) => i !== null && (prog[i].kind === 'load' || prog[i].kind === 'store');
    IF = next++;                                           // cycle 1 fetch
    for (; t < 500; t++) {
      if (WB !== null) lastWB = t;
      // hazard unit looks at the instruction in ID against those in EX and MEM
      let stall = false;
      if (ID !== null) {
        const c = prog[ID];
        const regsEX = forwarding ? c.use : c.use.concat(c.useMem);       // store data is needed late only when forwarding exists
        if (EX !== null && prog[EX].dst) {
          if (forwarding) { if (prog[EX].kind === 'load' && regsEX.includes(prog[EX].dst)) stall = true; }
          else if (regsEX.includes(prog[EX].dst)) stall = true;
        }
        if (!forwarding && MEM !== null && prog[MEM].dst && regsEX.includes(prog[MEM].dst)) stall = true;
      }
      WB = MEM; MEM = EX;
      if (stall) EX = null; else { EX = ID; ID = IF; IF = null; }
      if (IF === null && next < prog.length && !(unified && isMem(MEM))) IF = next++;
      if (WB === null && MEM === null && EX === null && ID === null && IF === null && next >= prog.length) break;
    }
    return lastWB;
  }

  /* ---- branch/jump-aware reference pipeline, on executed traces ---- */
  function refPipe2(trace, fwd, stage, policy, unified) {
    const n = trace.length, sIdx = { ID: 0, EX: 1, MEM: 2 }[stage]; let IF = null, ID = null, EX = null, MEM = null, WB = null, next = 0, lastWB = 0, waitFor = null;
    const isMem = (i) => i !== null && (trace[i].kind === 'load' || trace[i].kind === 'store');
    const pen = (i) => trace[i].kind === 'jump' || (trace[i].kind === 'branch' && (policy === 'stall' || trace[i].taken));
    const resolveIdx = (i) => (trace[i].kind === 'jump' ? 0 : sIdx);
    const fetch = () => { if (IF === null && next < n && waitFor === null && !(unified && isMem(MEM))) { IF = next++; if (pen(IF)) waitFor = IF; } };
    fetch();
    for (let t = 1; t < 2000; t++) {
      if (WB !== null) lastWB = t;
      let stall = false;
      if (ID !== null) {
        const c = trace[ID], uses = [].concat(c.use.map((r) => [r, c.kind === 'branch' ? sIdx : c.kind === 'jump' ? 0 : 1]), c.useMem.map((r) => [r, 2]));
        for (const [r, u] of uses) {
          const p = [EX, MEM].find((x) => x !== null && trace[x].dst === r);
          if (p === undefined) continue;
          const load = trace[p].kind === 'load', inEX = p === EX;
          if (!fwd) { stall = true; continue; }
          const ready = inEX ? (load ? t + 2 : t + 1) : (load ? t + 1 : t);
          if (t + u < ready) stall = true;
        }
      }
      if (waitFor !== null) {
        const s = resolveIdx(waitFor);
        if ((s === 0 && waitFor === ID && !stall) || (s === 1 && waitFor === EX) || (s === 2 && waitFor === MEM)) waitFor = null;
      }
      WB = MEM; MEM = EX;
      if (stall) EX = null; else { EX = ID; ID = IF; IF = null; }
      fetch();
      if (WB === null && MEM === null && EX === null && ID === null && IF === null && next >= n) break;
    }
    return lastWB;
  }

        <p class="note">MESI's Exclusive state removes the bus upgrade on a private read-then-write. MOESI's Owned state avoids writing dirty data back to memory when it is shared.</p></div>`;

    TABS.forEach(([t]) => { $('#p-' + t).hidden = t !== id; $('#tab-' + t).setAttribute('aria-selected', t === id ? 'true' : 'false'); });
    if (!built[id]) { built[id] = true; panels[id]($('#p-' + id)); }
    if (location.hash !== '#' + id) { try { history.replaceState(null, '', '#' + id); } catch (e) { /* sandboxed */ } }
  }
  nav.addEventListener('click', (e) => { const b = e.target.closest('button'); if (b) show(b.dataset.id); });
  nav.addEventListener('keydown', (e) => { const ids = TABS.map((t) => t[0]), cur = ids.indexOf(location.hash.slice(1)); if (e.key === 'ArrowRight' || e.key === 'ArrowLeft') { const n = ids[(Math.max(cur, 0) + (e.key === 'ArrowRight' ? 1 : ids.length - 1)) % ids.length]; show(n); $('#tab-' + n).focus(); } });
  show(location.hash.slice(1) || 'workbench');

  /* ── theme toggle (remembers the choice when storage is available) ── */
  (function () {
    const root = document.documentElement, btn = $('#theme'), mq = window.matchMedia ? window.matchMedia('(prefers-color-scheme: dark)') : null;
    const sun = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M4.9 4.9l1.4 1.4m11.4 11.4 1.4 1.4M2 12h2m16 0h2M4.9 19.1l1.4-1.4m11.4-11.4 1.4-1.4"/></svg>';
    const moon = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 14.5A8.5 8.5 0 1 1 9.5 4 6.6 6.6 0 0 0 20 14.5Z"/></svg>';
    const isDark = () => root.dataset.theme !== 'light';
    const paint = () => { btn.innerHTML = isDark() ? sun : moon; btn.title = isDark() ? 'Switch to light theme' : 'Switch to dark theme'; };
    try { const t = localStorage.getItem('archlab-theme'); if (t === 'dark' || t === 'light') root.dataset.theme = t; } catch (e) { /* storage unavailable */ }
    btn.addEventListener('click', () => { const t = isDark() ? 'light' : 'dark'; root.dataset.theme = t; try { localStorage.setItem('archlab-theme', t); } catch (e) { /* ignore */ } paint(); });
    if (mq && mq.addEventListener) mq.addEventListener('change', paint);
    paint();
  })();

  /* ── overview panel: collapsed by default, remembers the choice when storage is available ── */
  (function () {
    const d = $('#overview'); if (!d) return;
    try { if (localStorage.getItem('archlab-overview') === 'open') d.open = true; } catch (e) { /* storage unavailable */ }
    d.addEventListener('toggle', () => { try { localStorage.setItem('archlab-overview', d.open ? 'open' : 'closed'); } catch (e) { /* ignore */ } });
  })();

  /* ── hero: a floorplan of the machine ArchLab models. Blocks link to their tabs; the numbers come from the real engines ── */
  (function () {
    const host = $('#hero-viz'); if (!host) return;
    const PS = window.ArchLabPipe, ST = [['IF', 'fetch'], ['ID', 'decode'], ['EX', 'execute'], ['MEM', 'load / store'], ['WB', 'write back']], SW = 70, GAP = 12, X0 = 12, SH = 44;
    const sx = (i) => X0 + i * (SW + GAP), right = sx(4) + SW;
    let g = '';
    const blk = (cls, x, y, w, h, t1, t2, go, tip) => `<g class="fp ${cls}" data-go="${go}" tabindex="0" role="link" aria-label="${esc(tip)}"><title>${esc(tip)}</title><rect x="${x}" y="${y}" width="${w}" height="${h}" rx="8"/><text class="t1" x="${x + w / 2}" y="${y + h / 2 - (t2 ? 2 : -4)}">${t1}</text>${t2 ? `<text class="t2" x="${x + w / 2}" y="${y + h / 2 + 12}">${t2}</text>` : ''}</g>`;
    // pipeline row
    ST.forEach(([n, d], i) => { g += blk('s' + i + (i === 3 ? ' mem' : ''), sx(i), 14, SW, SH, n, d, 'hz', n + ': open the Pipeline hazards tab'); if (i) g += `<path class="fp-a" d="M${sx(i) - GAP + 1} ${14 + SH / 2}h${GAP - 4}"/>`; });
    g += `<text class="fp-cap" x="${X0}" y="9">5-STAGE PIPELINE</text>`;
    // cache column
    const ic = sx(0), dc = sx(3), cy = 92, ch = 42;
    g += `<path class="fp-a v" d="M${ic + SW / 2} ${14 + SH}V${cy - 3}"/><path class="fp-a v e1" d="M${dc + SW / 2} ${14 + SH}V${cy - 3}"/>`;
    g += blk('c1', ic, cy, SW, ch, 'I-cache', 'L1 · 1 cycle', 'workbench', 'L1 instruction cache: open the Cache tab') + blk('c1 dc', dc, cy, SW, ch, 'D-cache', 'L1 · 1 cycle', 'workbench', 'L1 data cache: open the Cache tab');
    const l2y = 160, l2h = 38, l2w = right - X0;
    g += `<path class="fp-a v" d="M${ic + SW / 2} ${cy + ch}V${l2y - 3}"/><path class="fp-a v e2" d="M${dc + SW / 2} ${cy + ch}V${l2y - 3}"/>`;
    g += blk('c2 l2', X0, l2y, l2w, l2h, 'L2 cache', 'shared · ~10 cycles', 'workbench', 'L2 cache: open the Cache tab');
    g += `<path class="fp-a v e3" d="M${X0 + l2w / 2} ${l2y + l2h}V${l2y + l2h + 14}"/>`;
    g += blk('mm', X0, l2y + l2h + 16, l2w, 34, 'Main memory', '~100 cycles', 'sys', 'Main memory: open the Whole processor tab');
    // coherence callouts on the right
    const rx = right + 22;
    g += blk('co', rx, 160, 118, l2h, 'Coherence', 'MESI · SMP', 'coh', 'Cache coherence: open the Coherence tab');
    g += blk('ilp', rx, 14, 118, SH, 'Superscalar', 'ILP · superscalar', 'ilp', 'Parallelism: open the Parallelism tab');
    const W = rx + 118 + 12, H = l2y + l2h + 16 + 34 + 8;
    host.innerHTML = `<svg viewBox="0 0 ${W} ${H}" role="group" aria-label="Block diagram of the modelled machine: pipeline, L1 caches, L2, memory, coherence, superscalar issue">${g}</svg>
      <div class="fp-ctl"><span class="fp-k">Send a load</span><div class="seg" role="group" aria-label="Where the load is found"><button type="button" data-m="0" aria-pressed="true">L1 hit</button><button type="button" data-m="1" aria-pressed="false">L1 miss, L2 hit</button><button type="button" data-m="2" aria-pressed="false">Miss to memory</button></div></div>
      <div class="fp-read" id="fp-read" aria-live="polite"></div>
      <div class="fp-bar" id="fp-bar" aria-hidden="true"><span class="b1"><b>1</b> D-cache</span><span class="b2"><b>10</b> L2</span><span class="b3"><b>100</b> memory</span></div>
      <div class="fp-live" id="fp-live"><span class="fp-k">Live demo</span><div class="fp-kpis" id="fp-n"><span class="kp">computing…</span></div></div>`;
    // the load animation: lights the path the request takes and adds up the latency (AMAT building blocks)
    const T = [['D-cache', 1], ['L2', 10], ['memory', 100]], reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    let mode = 0, auto = true, tm = [], loop = null;
    const svg = $('svg', host), q = (c) => [...svg.querySelectorAll(c)];
    function clear() { tm.forEach(clearTimeout); tm = []; q('.lit').forEach((n) => n.classList.remove('lit')); }
    function play(m) {
      clear(); mode = m; host.querySelectorAll('[data-m]').forEach((x) => x.setAttribute('aria-pressed', +x.dataset.m === m));
      const seq = [['.mem'], ['.e1', '.dc']].concat(m >= 1 ? [['.e2', '.l2']] : []).concat(m >= 2 ? [['.e3', '.mm']] : []);
      const parts = T.slice(0, m + 1), sum = parts.reduce((a, b) => a + b[1], 0);
      const text = (k) => { const sh = parts.slice(0, k); return sh.length ? `${sh.map((x, i) => (i ? ' + ' : '') + `<b>${x[1]}</b> <i>${x[0]}</i>`).join('')}${k === parts.length ? ` = <b class="tot">${sum} cycle${sum > 1 ? "s" : ""}</b>` : ''}` : 'load issued in MEM…'; };
      const R = $('#fp-read', host); R.innerHTML = reduce ? text(parts.length) : text(0);
      host.querySelectorAll('#fp-bar span').forEach((s, i) => s.classList.toggle('on', i <= m));
      seq.forEach((sel, k) => { const run = () => { sel.forEach((c) => q(c).forEach((n) => n.classList.add('lit'))); R.innerHTML = text(Math.min(k, parts.length)); if (k + 1 === seq.length) R.innerHTML = text(parts.length); }; if (reduce) run(); else tm.push(setTimeout(run, 350 + k * 650)); });
      if (reduce) seq.forEach((sel) => sel.forEach((c) => q(c).forEach((n) => n.classList.add('lit'))));
    }
    host.addEventListener('click', (e) => { const b = e.target.closest('[data-m]'); if (!b) return; auto = false; play(+b.dataset.m); });
    play(0);
    if (!reduce) loop = setInterval(() => { if (!host.isConnected) { clearInterval(loop); return; } if (auto) play((mode + 1) % 3); }, 3600);
    host.addEventListener('click', (e) => { const b = e.target.closest('[data-go]'); if (b) go(b.dataset.go); });
    host.addEventListener('keydown', (e) => { if (e.key !== 'Enter') return; const b = e.target.closest('[data-go]'); if (b) go(b.dataset.go); });
    function go(id) { const t = $('#tab-' + id); if (t) { t.click(); window.scrollTo({ top: nav.getBoundingClientRect().top + scrollY - 8, behavior: 'smooth' }); } }
    // real numbers: a small program on a 5-stage pipeline + a matrix-multiply trace on an 8 KB 2-way L1 with a 256 KB L2
    setTimeout(() => {
      try {
        const o = PS.simulate(PEX.mixed.prog, Object.assign({}, PS.DEFAULTS, { init: PEX.mixed.init, max: 100 })).metrics;
        const addrs = L.buildWorkload('matmul', { n: 32 }), st = L.simulate(addrs, { l1Bytes: 8192, line: 32, ways: 2, policy: 'LRU', l2Bytes: 262144, l2Ways: 8, write: 'back' });
        const t1 = 1, t2 = 10, tm = 100, amat = (st.l1 * t1 + st.v * t1 + st.l2 * (t1 + t2) + st.mem * (t1 + t2 + tm)) / st.accesses;
        $('#fp-n', host).innerHTML = `<div class="kp k1" title="5-stage pipeline, mixed-latency demo program"><em>Pipeline CPI</em><b>${fmt(o.cpi, 2)}</b><small>demo program</small></div><div class="kp k2" title="matrix multiply 32×32 on an 8 KB 2-way L1 with a 256 KB L2"><em>L1 hit rate</em><b>${pct(st.hitRate, 1)}</b><small>matmul 32×32</small></div><div class="kp k3" title="AMAT with L1 1, L2 10 and memory 100 cycles"><em>Avg memory access</em><b>${fmt(amat, 2)}</b><small>cycles per access</small></div>`;
      } catch (err) { $('#fp-n', host).textContent = 'every block is a simulator: click one'; }
    }, 300);
    // clickable topic chips jump to the tab
    document.querySelectorAll('.hero-chips [data-go]').forEach((b) => b.addEventListener('click', () => { const t = $('#tab-' + b.dataset.go); if (t) { t.click(); t.scrollIntoView({ block: 'nearest', inline: 'center' }); window.scrollTo({ top: nav.getBoundingClientRect().top + scrollY - 8, behavior: 'smooth' }); } }));
  })();
})();

</script>
